version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # TanStack AI is pre-1.0: keep both packages on the same release
      tanstack:
        patterns: ['@tanstack/*']
      dev-tooling:
        dependency-type: development
    ignore:
      # Types must match the minimum supported Node (engines: >=24)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
