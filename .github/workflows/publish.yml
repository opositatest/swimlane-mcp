name: Publish to npm

# Fallback: publishes an existing release again (e.g. if the npm step of
# "Create Release" failed). "Create Release" already publishes on its own.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        if: github.event_name == 'release'
        run: |
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (pkg.version !== tag) { console.error(`Release tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${pkg.version}. Update package.json first or use the Create Release workflow to create the next version.`); process.exit(1); }"

      # prepublishOnly runs lint:check, tests and build
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
