name: Publish to npm

# Fallback: publishes an existing release again (e.g. if the npm step of
# "Create Release" failed). "Create Release" already publishes on its own.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Fails early and with a clear message when the version in package.json cannot be published:
      # a release tag that does not match it, or a version that is already on the registry (npm never
      # overwrites one). Without this, the run ends with a raw npm error that reads like a broken token.
      - name: Validate release version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $VERSION. Update package.json first or use the Create Release workflow to create the next version."
              exit 1
            fi
          fi
          if npm view "@opositatest/swimlane-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@opositatest/swimlane-mcp@$VERSION is already published, and npm never overwrites a version. This fallback only publishes a version that is not on the registry yet: run Actions > Create Release to bump it."
            exit 1
          fi
          echo "Publishing @opositatest/swimlane-mcp@$VERSION"

      # Trusted publishing (OIDC): npm authenticates the workflow through GitHub, so no npm token is
      # stored in this repository. The trust relationship lives in npm (package > Settings > Trusted
      # publishing), one connection per workflow file.
      - name: Use the latest npm (OIDC needs 11.21+ to move the `latest` dist-tag)
        run: npm install -g npm@latest && npm --version

      # prepublishOnly runs lint:check, tests and build
      - name: Publish
        run: npm publish --access public --provenance
