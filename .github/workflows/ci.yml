name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24 = LTS, the .node-version minimum and what Claude Desktop ships; 26 = Current.
        # Test Linux/Ubuntu too: the extension manifest supports all three platforms.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '26'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test
      - run: npm run build

      # The package that npx installs must contain the entry point and nothing private
      - name: Check npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const bad = files.filter((f) => !/^(build\/|README\.md$|LICENSE$|package\.json$)/.test(f));
            if (!files.includes('build/main.js')) { console.error('build/main.js missing from package'); process.exit(1); }
            if (bad.length) { console.error('Unexpected files in package:', bad); process.exit(1); }
            console.error('Package files OK:', files.length);
          "

      - name: Build Claude Desktop extension
        run: npm run bundle:extension

      - name: Test installed npm package and Desktop entry point
        run: npm run test:package

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: claude-desktop-extension
          path: dist-extension/*.mcpb
          retention-days: 14
